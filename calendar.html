<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Event Calendar</title>
  <link rel="stylesheet" href="calendar.css" />
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />
  
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <script src="calendar.js" defer></script>
</head>
<body>

  <section class="calendar-container">

    
     <div class="event-list">
    <div class="sidebar-section">
        <div class="logo-cognate">
            <img src="logo-cognate.png" alt="Cognate Logo">
        </div>
        
        
    </div>


      <h2>Event List</h2>
      <table>
        <thead>
          <tr>
            <th>Event Name</th>
            <th>Date</th>
            <th>Time</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        
        <tbody id="eventTable"></tbody>
        
    <button class="add-event-btn" id="openModalBtn">Add New Event</button>
      </table>
    </div>

    <!-- Calendar -->
    <div class="calendar">
      <h2>Calendar</h2>
      <div id="calendar"></div>
    </div>

  </section>

  <!-- Modal -->
  <div id="eventModal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2 id="modalTitle">Add New Event</h2>
      <form id="eventForm">
        <input type="hidden" id="eventId" />
        <label for="eventName">Event Name:</label>
        <input type="text" id="eventName" placeholder="Event Name" required />

        <label for="eventDate">Date:</label>
        <input type="date" id="eventDate" required />

        <label for="startTime">Start Time:</label>
        <input type="time" id="startTime" step="300" />

        <label for="endTime">End Time:</label>
        <input type="time" id="endTime" step="300" />

        <label for="eventDescription">Description:</label>
        <textarea id="eventDescription" placeholder="Description" rows="3"></textarea>

        <button type="submit" id="submitBtn">Add Event</button>
        <button type="button" id="cancelBtn" style="display:none;">Cancel</button>
      </form>
    </div>
  </div>

</body>
</html>
